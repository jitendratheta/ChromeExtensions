<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bookmark Organizer</title>
<style>
  :root {
    --bg: #1e1e2e; --bg2: #27273a; --fg: #cdd6f4; --dim: #6c7086;
    --cyan: #89dceb; --accent: #cba6f7; --sel: #313244; --green: #a6e3a1; --red: #f38ba8;
  }
  :root[data-theme="light"] {
    --bg: #f5f5fa; --bg2: #ffffff; --fg: #2e2e3e; --dim: #8a8a9a;
    --cyan: #0e7490; --accent: #7c3aed; --sel: #e4e4ef; --green: #15803d; --red: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column;
  }
  header { padding: 14px 20px 10px; }
  h1 { font-size: 17px; }
  .sub { color: var(--dim); font-size: 12px; }

  #layout { flex: 1; display: flex; min-height: 0; }

  /* ---- left: folder tree ---- */
  #tree {
    width: 480px; min-width: 180px; max-width: 70vw; flex: none;
    overflow-y: auto; padding: 8px 0 20px;
  }
  #resizer {
    width: 5px; flex: none; cursor: col-resize;
    background: var(--sel); opacity: .6;
  }
  #resizer:hover, #resizer.dragging { background: var(--accent); opacity: 1; }
  .fnode {
    display: flex; align-items: center; gap: 6px; padding: 3px 10px;
    cursor: pointer; white-space: nowrap; overflow: hidden;
  }
  .fnode:hover { background: var(--bg2); }
  .fnode.sel { background: var(--sel); }
  .fnode .tri {
    flex: none; width: 14px; text-align: center; color: var(--dim);
    cursor: pointer; user-select: none;
  }
  .fnode .tri:hover { color: var(--accent); }
  .fnode .name { overflow: hidden; text-overflow: ellipsis; }
  .fnode .cnt { color: var(--dim); font-size: 11px; flex: none; }
  .fnode .actions { margin-left: auto; flex: none; visibility: hidden; display: flex; gap: 4px; }
  .fnode:hover .actions { visibility: visible; }
  .fnode .actions button, .bm .rowedit {
    flex: none; color: var(--dim); border: 1px solid var(--sel); border-radius: 4px;
    padding: 0 6px; font-size: 12px; background: none; cursor: pointer;
  }
  .fnode .actions button:hover, .bm .rowedit:hover { color: var(--accent); border-color: var(--accent); }
  .fnode .actions button.del:hover { color: var(--red); border-color: var(--red); }
  .bm .rowedit { visibility: hidden; }
  .bm:hover .rowedit { visibility: visible; }
  input.rename {
    flex: 1; min-width: 140px; background: var(--bg2); color: var(--fg);
    border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px;
    font: inherit; outline: none;
  }
  .fnode.drop-into { background: var(--sel); outline: 1px dashed var(--accent); outline-offset: -1px; }
  .fnode.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .fnode.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .bm.dragging { opacity: .4; }

  /* ---- right: bookmark list ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--sel);
  }
  #toolbar input[type=text], #toolbar select, header select {
    background: var(--bg2); color: var(--fg); border: 1px solid var(--sel);
    border-radius: 6px; padding: 5px 8px; font: inherit; outline: none;
  }
  #toolbar input[type=text]:focus, #toolbar select:focus, header select:focus { border-color: var(--accent); }
  #filter { width: 240px; }
  button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 6px;
    padding: 5px 12px; font: inherit; font-weight: 700; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--sel); font-weight: 400; }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); font-weight: 400; }
  button.danger:hover { background: var(--red); color: var(--bg); }
  button:hover { filter: brightness(1.1); }
  .badge { background: var(--sel); border-radius: 4px; padding: 1px 7px; font-size: 12px; color: var(--dim); }

  #list { flex: 1; overflow-y: auto; padding: 6px 0 30px; }
  .bm {
    display: flex; align-items: center; gap: 8px; padding: 3px 16px;
    white-space: nowrap; overflow: hidden;
  }
  .bm:hover { background: var(--bg2); }
  .bm img { width: 16px; height: 16px; flex: none; }
  .bm a.t { color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .bm a.t:hover { color: var(--accent); text-decoration: underline; }
  .bm .p { color: var(--dim); font-size: 12px; flex: none; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .bm .u { color: var(--cyan); opacity: .6; font-size: 12px; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  input[type=checkbox] { accent-color: var(--accent); flex: none; }
  .empty { color: var(--dim); padding: 12px 16px; }

  #toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--green); color: var(--bg);
    padding: 10px 16px; border-radius: 8px; font-weight: 700; display: none; z-index: 10;
  }
</style>
</head>
<body>
  <header style="display:flex; align-items:flex-start; gap:20px">
    <div style="flex:1">
      <h1>Bookmark Organizer</h1>
      <div class="sub">Click a folder to browse it · type in the filter to search everywhere · check bookmarks and move them · click a title to open it · drag to reorganize</div>
    </div>
    <div class="sub" style="display:flex; gap:10px; align-items:center; white-space:nowrap">
      Search UI:
      <select id="set-display">
        <option value="overlay">Overlay (no title bar)</option>
        <option value="window">Popup window</option>
      </select>
      Theme:
      <select id="set-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
  </header>
  <div id="layout">
    <aside id="tree"></aside>
    <div id="resizer"></div>
    <div id="main">
      <div id="toolbar">
        <input type="text" id="filter" placeholder="filter all bookmarks…">
        <span class="badge" id="count">0</span>
        <button class="ghost" id="sel-all">Select all</button>
        <button class="ghost" id="sel-none">Clear</button>
        <span style="flex:1"></span>
        <button class="ghost" id="open-sel">Open selected</button>
        <button class="danger" id="del-sel">Delete</button>
        <select id="target"></select>
        <input type="text" id="newname" placeholder="new folder name" size="16" style="display:none">
        <button id="move">Move</button>
      </div>
      <div id="list"></div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="organize.js"></script>
</body>
</html>
